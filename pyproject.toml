[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pybaiduphoto"
version = "0.2.0"
description = "Baidu Photo API with read-only inventory tools"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.3", "rich>=10.16.1"]

[project.scripts]
baiduphoto = "pybaiduphoto.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["pybaiduphoto*"]

[tool.setuptools.package-data]
pybaiduphoto = ["defaults.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
